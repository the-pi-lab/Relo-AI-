name = "relo-engine"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
META_GRAPH_API_VERSION = "v21.0"

[[d1_databases]]
binding = "DB"
database_name = "relo-d1"
database_id = "relo-d1-prod"

[triggers]
crons = ["* * * * *"] # Executes every 1 minute for Cron-as-Queue batch processing
