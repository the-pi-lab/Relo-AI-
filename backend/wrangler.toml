name = "relo-engine"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "production"
META_GRAPH_API_VERSION = "v21.0"
# Worker origin used for short links (/l/:id) - set to your deployed URL
PUBLIC_BASE_URL = "https://relo-engine.empty-smoke-5043.workers.dev"
# Frontend origin used by the RELO branding button redirect (/r/:accountId)
PUBLIC_APP_URL = "https://relo-nu.vercel.app"
# CORS allowlist. Comma-separated origins, scheme included, no trailing slash and
# NO wildcard. `PUBLIC_APP_URL` above is allowed automatically; list any extra
# origins (staging dashboard, custom domain) here. Localhost is added
# automatically whenever ENVIRONMENT is not "production".
ALLOWED_ORIGINS = "https://relo-nu.vercel.app"
# Flip to "1" only after TURNSTILE_SECRET_KEY is set as a secret: makes a
# missing CAPTCHA secret a hard failure instead of a logged warning.
REQUIRE_CAPTCHA = "0"

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   JWT_SECRET                 256-bit random string (required; the API fails closed without it)
#   OTP_PEPPER                 256-bit random string for hashing login codes
#                              (falls back to JWT_SECRET; a dedicated value is preferred)
#   META_HUMAN_AGENT_APPROVED  set to "1" only after Meta approves the HUMAN_AGENT tag
#   ENCRYPTION_MASTER_KEY      64 hex chars (AES-256-GCM vault key)
#   META_APP_ID / META_APP_SECRET
#   META_VERIFY_TOKEN
#   RESEND_API_KEY
#   ADMIN_SECRET               break-glass admin header (constant-time compared)
#   ADMIN_EMAILS               comma-separated admin emails
#   TURNSTILE_SECRET_KEY       Cloudflare Turnstile secret
#   MANUAL_UPI_ID / LEMON_SQUEEZY_CHECKOUT_URL
#   LEMON_SQUEEZY_WEBHOOK_SECRET  Lemon Squeezy signing secret (POST /api/billing/lemonsqueezy)
#   LEMON_SQUEEZY_PRO_VARIANT_ID / LEMON_SQUEEZY_STUDIO_VARIANT_ID
#                              variant ids that map a purchase to Pro/Studio
#   META_GRAPH_API_VERSION     optional override; defaults to the var above (v21.0)

[[d1_databases]]
binding = "DB"
database_name = "relo-d1"
# Replace with the UUID emitted by `wrangler d1 create relo-d1`
database_id = "c4542572-e227-4d6d-8327-5bc24db3eabb"

[triggers]
crons = ["* * * * *"] # Executes every 1 minute for Cron-as-Queue batch processing
