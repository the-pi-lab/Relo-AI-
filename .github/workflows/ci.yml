name: CI & Quality Guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Lint, Tests, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Run Production Build
        run: npm run build

  cloudflare-engine:
    name: Cloudflare Workers Engine (Typecheck + E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck engine
        working-directory: backend
        run: npm run typecheck

      - name: Run Engine Test Suite
        working-directory: backend
        run: npm test
